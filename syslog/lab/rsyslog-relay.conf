###############################################################################
# Forward a COPY of network-device syslog to the IT Dashboard collector.
#
# Hand this to the customer's team. Install as:
#     /etc/rsyslog.d/60-itdashboard.conf
# then:
#     sudo rsyslogd -N1                     # validate before restarting
#     sudo systemctl restart rsyslog
#
# This only ADDS a destination. Their existing rules, files and forwards are
# untouched, so nothing that works today changes.
###############################################################################

# --- EDIT THESE TWO -------------------------------------------------------
# The IT Dashboard collector box:
#   target = its IP,  port = 514 (or 5514 if the agent listens there)
#
# And the filter below: restrict it to the subnets your network devices live
# on, so you are not shipping server and application logs as well.
# --------------------------------------------------------------------------

if ($fromhost-ip startswith "10.20.30."        # <-- EDIT: device subnets
 or $fromhost-ip startswith "10.20.31.") then {

    action(type="omfwd"
           target="10.20.30.50"                # <-- EDIT: collector IP
           port="514"
           protocol="udp"

           # ===================================================================
           # THE TEMPLATE IS LOAD-BEARING. DO NOT LEAVE IT UNSET.
           #
           # rsyslog's DEFAULT for omfwd is RSYSLOG_ForwardFormat, which
           # rewrites the header to an RFC 3339 timestamp WITHOUT the RFC 5424
           # version digit:
           #
           #   <131>2026-09-21T19:00:00+00:00 SW-CORE-01 %SYS-3-POWER: ...
           #
           # That is neither RFC 3164 nor RFC 5424, and a strict parser rejects
           # every message - silently. Verified in the lab: 0 of 6 messages
           # parsed with the default template.
           #
           # RSYSLOG_SyslogProtocol23Format emits proper RFC 5424 and keeps the
           # timezone and sub-second precision. Use it.
           #
           # RSYSLOG_TraditionalForwardFormat also works (classic RFC 3164) but
           # loses the year and sub-second precision.
           # ===================================================================
           template="RSYSLOG_SyslogProtocol23Format"

           # Survive a brief outage of the collector instead of dropping.
           queue.type="LinkedList"
           queue.filename="itdashboard_fwd"
           queue.maxDiskSpace="256m"
           queue.saveOnShutdown="on"
           action.resumeRetryCount="-1"
    )

    # Do NOT add "stop" here - without it the messages continue through the
    # rest of the ruleset and still reach wherever they go today.
}

###############################################################################
# Notes for whoever reviews this
#
# 1. The original device HOSTNAME is preserved in the forwarded message, which
#    is what the dashboard keys devices on. Verified in the lab.
#
# 2. The forwarded message's SOURCE IP will be this collector's IP, not the
#    device's - UDP carries the last hop only. The dashboard is configured with
#    hostname-based keys to match, so device hostnames must be UNIQUE across
#    every device behind this relay.
#
# 3. This is send-only. The dashboard collector needs no access to this box or
#    to any device.
#
# 4. Volume: one extra UDP copy per matched message. Narrow the filter above if
#    that is a concern.
###############################################################################
