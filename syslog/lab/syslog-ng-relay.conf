###############################################################################
# syslog-ng equivalent: forward a COPY of network-device syslog to the
# IT Dashboard collector.
#
# Hand this to the customer's team. Install as:
#     /etc/syslog-ng/conf.d/60-itdashboard.conf
# then:
#     sudo syslog-ng --syntax-only           # validate before restarting
#     sudo systemctl restart syslog-ng
#
# Only ADDS a destination - existing log paths are untouched.
###############################################################################

# --- EDIT: the IT Dashboard collector -------------------------------------
destination d_itdashboard {
    # syslog() sends RFC 5424, which the dashboard parses correctly.
    # Do NOT use a bare udp() with a custom template unless you have checked
    # what header it produces - see the note at the bottom.
    syslog(
        "10.20.30.50"                      # <-- EDIT: collector IP
        transport("udp")
        port(514)
    );
};

# --- EDIT: which devices to forward ---------------------------------------
filter f_network_devices {
    netmask("10.20.30.0/24")               # <-- EDIT: device subnets
    or netmask("10.20.31.0/24");
};

log {
    source(s_net);                         # <-- EDIT: your network source name
    filter(f_network_devices);
    destination(d_itdashboard);
    # no flags(final) - messages continue to their existing destinations
};

###############################################################################
# IMPORTANT: preserve the original hostname
#
# syslog-ng rewrites the hostname to the sending relay's name unless this is
# set. Without it every device arrives as this collector's hostname and the
# dashboard cannot tell them apart.
#
# Set globally in syslog-ng.conf:
#
#     options {
#         keep-hostname(yes);
#         chain-hostnames(no);
#     };
#
# or per-source. Verify after restarting - see the verification step below.
###############################################################################

###############################################################################
# Verify it worked
#
# On the dashboard collector box, before starting the agent:
#
#     sudo python3 discover.py --port 514 --duration 300
#
# Expect: ONE source IP (this collector's) with MANY distinct hostnames, and
# zero "UNPARSEABLE" packets. If hostnames all read as this collector's name,
# keep-hostname(yes) is missing. If packets are UNPARSEABLE, the header format
# is wrong - use the syslog() driver as above rather than udp() with a template.
###############################################################################
